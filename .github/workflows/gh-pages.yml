name: Build and deploy documentation

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # conf.py imports nothing from motion_spec, so the package itself is not built.
      # Keep this list in sync with the [docs] extra in pyproject.toml (minus sphinx-autobuild);
      # installing the extra directly would pull workspace deps that are not on PyPI.
      - name: Install documentation dependencies
        run: pip install sphinx myst-parser furo matplotlib
      - name: Build documentation
        run: sphinx-build -W -b html docs/sphinx/source docs/_build/html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
          retention-days: 1

  # Build on every branch and PR so failures surface early; publish only from
  # main or dev.
  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
