name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install motion_spec
        run: pip install -e ".[test]" vcstool

      # The Python packages motion_spec.repos lists, in its order: none are on PyPI, and most
      # test modules import one, so leaving them out fails collection rather than a test.
      - name: Install the manifest's Python packages
        run: |
          mkdir -p ws/src
          vcs import --input src/motion_spec/motion_spec.repos ws/src
          python - <<'EOF'
          import subprocess, sys
          from motion_spec.setup import MANIFEST, STST_REPOSITORY, is_thirdparty, read_manifest, shipped
          for repository in read_manifest(shipped(MANIFEST)):
              if is_thirdparty(repository) and repository.path != STST_REPOSITORY:
                  subprocess.run([sys.executable, "-m", "pip", "install", f"ws/src/{repository.path}"], check=True)
          EOF

      - name: Run tests
        run: pytest -q
