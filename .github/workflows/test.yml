name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Workspace siblings, none on PyPI. The DSL packages are what parse a .robmot,
      # and most test modules import one, so leaving them out fails collection rather
      # than a test. pyshacl/protobuf cover the validation/introspection extras.
      - name: Install workspace siblings
        run: |
          pip install pytest pyshacl protobuf click textx PyLD numpy scipy jinja2
          pip install \
            "git+https://github.com/secorolab/rdf-utils.git@main" \
            "git+https://github.com/secorolab/rec.git@dev"
          # --no-deps: motion-spec-dsl asks for rdflib>=8.0.0, which nothing provides -- the
          # patched fork every workspace package actually runs on reports 7.6.0. Their real
          # imports are installed above; the pin below settles rdflib for all of them.
          pip install --no-deps \
            "git+https://github.com/secorolab/scene-dsl.git@main" \
            "git+https://github.com/secorolab/coord-dsl.git@main" \
            "git+https://github.com/secorolab/motion-spec-dsl.git@dev"

      - name: Install motion_spec
        run: pip install -e . --no-deps

      # The patched rdflib must win over the PyPI rdflib the siblings pulled in.
      - name: Pin patched rdflib
        run: |
          pip install --force-reinstall --no-deps \
            "git+https://github.com/secorolab/rdflib.git@7.6.0-fix-multi-type-scoped-context"

      - name: Run tests
        run: pytest -q
