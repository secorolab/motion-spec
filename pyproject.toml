[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motion_spec"
version = "0.1.0"
description = "IR generator and C++ code generator for motion specification models"
authors = [
    {name = "Sven Schneider", email = "sven.schneider@h-brs.de"},
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
maintainers = [
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
license = { text = "MPL-2.0" }
# 3.11 for tomllib: the workspace's motion-spec.config.toml is read with the stdlib.
requires-python = ">=3.11"
# The secorolab packages are on no index, so they carry their source: named alone they
# resolve nowhere and the whole install fails, wherever it is run from.
dependencies = [
    "click>=8.1",
    # No multi-type scoped @context support; generated models use none.
    "rdflib>=7.6.0",
    "rdf_utils @ git+https://github.com/minhnh/rdf-utils@main",
    "jinja2",
    "motion_spec_dsl @ git+https://github.com/secorolab/motion-spec-dsl@dev",
    "scene-dsl @ git+https://github.com/secorolab/scene-dsl@main",
    "pyshacl>=0.25.0",
    # `run` imports the runner, and the runner the frame log, whatever --no-log says: these
    # were an extra, and every run without them ended in a ModuleNotFoundError traceback.
    "rec @ git+https://github.com/secorolab/rec@dev",
    # frame_log_pb reads .pb logs via message_factory.GetMessageClass, added in 4.22.
    "protobuf>=4.22",
]

[project.optional-dependencies]
dashboard = ["nicegui>=2.0", "pillow"]
# The browser dashboard's notebook tab; its SPARQL console runs on the rdflib above.
replay = ["jupyterlab>=4.0", "matplotlib"]
all = ["nicegui>=2.0", "pillow", "jupyterlab>=4.0", "matplotlib"]
test = ["pytest", "pillow", "zstandard", "PyYAML", "empy", "lark"]
docs = ["sphinx", "myst-parser", "furo", "sphinx-autobuild", "matplotlib"]
dev = ["pytest", "ruff"]

[project.scripts]
motion-spec = "motion_spec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# frontend/**, not frontend/*: the vendored libraries live in subdirectories, and a
# single-level glob shipped a dashboard whose editor and charts were missing.
motion_spec = [
    "templates/*.stg",
    "dashboard/frontend/**/*",
    # `motion-spec setup` reads its pins from this at run time, so it has to ship.
    "*.repos",
]

[tool.pytest.ini_options]
# rdflib's Dataset.parse() internally reads its deprecated default_context
# property. pytest forces "always" on warnings, so the package-level filter in
# motion_spec/__init__.py doesn't apply under test — suppress it here too.
filterwarnings = [
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Collapse calls/collections/imports onto as few lines as fit in line-length,
# instead of keeping them exploded one-entity-per-line on a trailing comma.
skip-magic-trailing-comma = true
