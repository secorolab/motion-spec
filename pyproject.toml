[project]
name = "motion_spec"
version = "0.1.0"
description = "IR generator and C++ code generator for motion specification models"
authors = [
    {name = "Sven Schneider", email = "sven.schneider@h-brs.de"},
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
maintainers = [
    {name = "Vamsi Kalagaturu", email = "vamsikalagaturu@gmail.com"}
]
license = { text = "MPL-2.0" }
requires-python = ">=3.10"
dependencies = [
    "rdflib",
    "pyshacl>=0.25.0",
    "rec",
    "mcap",
]

[project.optional-dependencies]
dashboard = ["flask>=3"]

[project.scripts]
motion-spec-check = "motion_spec.check:main"
motion-spec-ir-gen = "motion_spec.ir_gen:main"
motion-spec-count = "motion_spec.count:main"
motion-spec-codegen = "motion_spec.codegen:main"
motion-spec-archive = "motion_spec.introspection.archive:main"
motion-spec-replay = "motion_spec.introspection.replay:main"
motion-spec-run = "motion_spec.introspection.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"code-generator" = [
    "code-generator/*.stg",
    "code-generator/CMakeLists.txt",
]
"thirdparty/orocos-kdl" = [
    "thirdparty/orocos-kdl/chainhdsolver_vereshchagin_fext.hpp",
    "thirdparty/orocos-kdl/chainhdsolver_vereshchagin_fext.cpp",
]
"thirdparty/kinova" = [
    "thirdparty/kinova/GEN3_URDF_V12.urdf",
]

[tool.pytest.ini_options]
# rdflib's Dataset.parse() internally reads its deprecated default_context
# property. pytest forces "always" on warnings, so the package-level filter in
# motion_spec/__init__.py doesn't apply under test — suppress it here too.
filterwarnings = [
    "ignore:Dataset.default_context is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
