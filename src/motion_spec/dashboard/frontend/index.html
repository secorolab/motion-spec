<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>motion-spec replay</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vendored, not fetched: a robot's machine is often on a network with no way out, and
         a dashboard whose charts depend on a CDN is a dashboard that is blank there. -->
    <script src="vendor/echarts.min.js"></script>
    <!-- live cards stream through uPlot; echarts stays for replay's zoom/cursor/export -->
    <link rel="stylesheet" href="vendor/uPlot.min.css">
    <script src="vendor/uPlot.iife.min.js"></script>
  </head>
  <body>
    <script>
      if (localStorage.getItem("motion-spec.sidebar-collapsed") === "true") document.body.classList.add("sidebar-collapsed");
      // Before the first paint: the width this sidebar was left at, and no empty state on a
      // reload that already names what to open -- both would otherwise be seen changing.
      const width = Number(localStorage.getItem("motion-spec.aside"));
      if (width) document.documentElement.style.setProperty("--aside", `${width}px`);
      const view = new URLSearchParams(location.hash.slice(1));
      // Anything but the bare logs tab replaces the empty state below, so do not let it be
      // seen first. Whatever renders instead takes the class back off.
      if ((view.get("tab") ?? "logs") !== "logs" || view.has("run") || view.has("generation")
          || view.has("explore") || view.has("source") || view.has("diff")) {
        document.documentElement.classList.add("restoring");
      }
    </script>
    <button id="sidebar-toggle" title="Collapse navigation" aria-label="Collapse navigation">×</button>

    <main>
      <aside>
        <div class="sidebar-header">
          <button id="home" class="brand">motion-spec</button>
          <nav>
            <button class="active" data-tab="logs">Logs</button>
            <button data-tab="sources">Sources</button>
            <button data-tab="notebook">Notebook</button>
          </nav>

          <div class="aside-head">
            <span id="list-title">GENERATIONS</span>
            <span id="storage"></span>
            <button id="refresh" title="Refresh">↻</button>
          </div>
          <div class="root-control">
            <input id="generation-root" value="/home/batsy/work/ms/generations" title="Edit path">
            <button id="pick-root" title="Choose folder" aria-label="Choose folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v10H3z"/></svg></button>
          </div>
          <script>
            if (new URLSearchParams(location.hash.slice(1)).get("tab") === "sources") {
              document.querySelector("nav button[data-tab=logs]").classList.remove("active");
              document.querySelector("nav button[data-tab=sources]").classList.add("active");
              document.querySelector("#list-title").textContent = "SOURCES";
              document.querySelector("#generation-root").value = "";
            }
          </script>

          <div class="search">
            <input id="search" type="search" placeholder="Filter list">
          </div>
        </div>

        <div id="browser"></div>
        <footer class="aside-foot">
          <button data-tab="health">Health</button>
          <a href="https://github.com/secorolab/motion-spec" target="_blank" rel="noopener">GitHub</a>
          <a href="https://secorolab.github.io/motion-spec/" target="_blank" rel="noopener">Docs</a>
        </footer>
        <div id="aside-resize" title="Drag to resize · double-click to reset"></div>
      </aside>

      <section id="content">
        <div class="empty">
          <span>REPLAY / 01</span>
          <h1>Choose a generation.</h1>
          <p>Its build metadata and recorded runs will appear here.</p>
        </div>
      </section>
    </main>

    <div id="selection-actions" hidden>
      <span id="selection-count"></span>
      <button id="clear-selection">Cancel</button>
      <button id="delete-selected">Delete</button>
    </div>
    <div id="snack" role="status" aria-live="polite"></div>

    <template id="generation-template">
      <article class="generation">
        <div class="page-heading"><h1></h1><span class="eyebrow">GENERATION</span></div>
        <div class="generation-path"><p class="path"></p><button class="copy-generation-path" title="Copy folder path" aria-label="Copy folder path">⧉</button></div>
        <p class="generation-description"></p>
        <div class="run-bar"><span class="run-choice" data-option="headless"><em>display</em><button data-value="false" aria-pressed="true">GUI</button><button data-value="true" aria-pressed="false">headless</button></span><span class="run-choice run-speed" data-option="realtime" hidden><em>speed</em><button data-value="true" aria-pressed="true">realtime</button><button data-value="false" aria-pressed="false">fast</button></span><span class="run-choice run-record" hidden><em>record</em></span><span class="run-choice" data-option="log"><em>log</em><button data-value="true" aria-pressed="true">on</button><button data-value="false" aria-pressed="false">off</button></span><button class="run-start">▶ run</button><button class="run-stop" hidden>stop</button><span class="run-state"></span></div>
        <div class="facts"></div>
        <div class="devices" hidden><div class="devices-head"><h2>Devices</h2><button class="devices-test">test connections</button><span class="devices-state"></span></div><div class="device-rows"></div></div>
        <h2 class="source-heading">Authored source</h2>
        <div class="source-files"></div>
        <div class="run-heading"><h2>Recorded runs</h2><span class="run-count"></span></div>
        <div class="run-header"><span>#</span><span>Run (time)</span><span>Started</span><span>Duration</span><span>Frames</span><span>Status</span></div>
        <div class="runs"></div>
        <div class="run-tools"><span class="run-filter"><label>from<input type="datetime-local" class="run-from"></label><label>to<input type="datetime-local" class="run-to"></label><button class="run-filter-clear" hidden>clear</button></span><div class="run-pagination"></div></div>
        <pre class="console run-console" hidden></pre>
        <div class="graph-heading"><h2>RDF graph</h2><button class="explore-link">explore →</button></div>
        <p class="graph-help">Ask this model's graph a question, and read the answer as a table or as a picture.</p>
        <h2>Generated files</h2><div class="generated-files"></div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
