<!-- The favicon's mark without its tile, for use inside the app. favicon.svg carries a dark
     ground because it lands on browser chrome this page does not control; on the page's own
     surfaces that ground reads as a sticker, so here the glyph sits on whatever is behind it.
     Same two frames, same geometry: keep the pair in step if either is redrawn. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="motion-spec">
  <rect x="3.6" y="3.6" width="14" height="14" rx="3" fill="none" stroke="#a7a8a4" stroke-width="3.2"/>
  <rect x="14.4" y="14.4" width="14" height="14" rx="3" fill="none" stroke="#e07a5f" stroke-width="3.2"/>
</svg>
