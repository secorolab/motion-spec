syntax = "proto3";

package motion_spec.introspection;

message FrameLogHeader {
  string schema_hash = 1;
  string producer_agent_id = 2;
  string activity_id = 3;
}

message ConstraintSlot {
  sfixed64 active = 1;
  double error = 2;
  double output = 3;
  sfixed64 satisfied = 4;
  double sat_t = 5;
  double measured = 6;
  double setpoint = 7;
}

message MonitorSlot {
  sfixed64 active = 1;
  double value = 2;
  sfixed64 satisfied = 3;
  double sat_t = 4;
}

message Trigger {
  sfixed64 kind = 1;
  sfixed64 idx = 2;
  sfixed64 fsm_state = 3;
  double t = 4;
  sfixed64 wall_ns = 5;
}

message PoseSlot {
  double px = 1;
  double py = 2;
  double pz = 3;
  double qx = 4;
  double qy = 5;
  double qz = 6;
  double qw = 7;
}

message TwistSlot {
  double lx = 1;
  double ly = 2;
  double lz = 3;
  double ax = 4;
  double ay = 5;
  double az = 6;
}

message WrenchSlot {
  double fx = 1;
  double fy = 2;
  double fz = 3;
  double tx = 4;
  double ty = 5;
  double tz = 6;
}

message RuntimeFrame {
  double t = 1;
  uint64 step = 2;
  sfixed64 fsm_state = 3;
  sfixed64 active_motion = 4;
  sfixed64 last_event = 5;
  double state_since_t = 6;
  sfixed64 state_since_wall_ns = 7;
  double event_t = 8;
  sfixed64 event_wall_ns = 9;
  sfixed64 wall_ns = 10;
  sfixed64 period_ns = 11;
  sfixed64 compute_ns = 12;
  repeated ConstraintSlot constraints = 13;
  repeated MonitorSlot monitors = 14;
  repeated double quantities = 15;
  repeated Trigger triggers = 16;
  sfixed64 trigger_count = 17;
  repeated PoseSlot poses = 18;
  repeated TwistSlot twists = 19;
  repeated WrenchSlot wrenches = 20;
}

message FrameLogRecord {
  oneof record {
    FrameLogHeader header = 1;
    RuntimeFrame frame = 2;
  }
}
